<!doctype html>
<meta charset="utf-8">
<title>BiRefNet試作</title>
<body style="font:12px monospace;background:#222;color:#ddd;margin:8px">
<!-- 使い方: python3 scripts/qc/serve.py 8140 → http://127.0.0.1:8140/scripts/qc/birefnet_proto.html?trial=B1&img=/test_img/Sample1.png
     BiRefNet_lite(MIT, 224MB fp32)を onnxruntime-web 1.20.1 で実行し、マスクを保存する（高精度モデルの上限確認用。製品組込は容量面で未定）。 -->
<pre id="log"></pre>
<script type="module">
const q=new URLSearchParams(location.search),TRIAL=q.get("trial")||"B1",IMG=q.get("img")||"/test_img/Sample1.png";
const log=t=>{document.getElementById("log").textContent+=t+"\n"};
const ORT="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
const KIND=q.get("model")||"birefnet";
const MODEL=KIND==="isnet"?"https://huggingface.co/xrds/isnet-general-onnx-int8/resolve/71eff2372ec9c8edbc6ca637ded591423d23b65a/onnx/model_quantized.onnx":"https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/de15b22ba131738a16dff04aab8bdf8dc32e3ac1/onnx/model.onnx";
const EP=q.get("ep")||"wasm";const ort=await import(ORT+(EP==="webgpu"?"ort.webgpu.bundle.min.mjs":"ort.bundle.min.mjs"));ort.env.wasm.wasmPaths=ORT;ort.env.wasm.numThreads=1;
let t0=performance.now();
const sess=await ort.InferenceSession.create(MODEL,{executionProviders:[EP]});
log("model loaded ms "+Math.round(performance.now()-t0)+" in "+sess.inputNames+" out "+sess.outputNames);
const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=IMG});
const S=1024,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,S,S);
const d=x.getImageData(0,0,S,S).data,p=S*S,t=new Float32Array(3*p),mean=[.485,.456,.406],std=[.229,.224,.225];
for(let i=0;i<p;i++)for(let k=0;k<3;k++)t[k*p+i]=KIND==="isnet"?(d[i*4+k]-128)/256:(d[i*4+k]/255-mean[k])/std[k];
t0=performance.now();
const out=await sess.run({[sess.inputNames[0]]:new ort.Tensor("float32",t,[1,3,S,S])});
const o=out[KIND==="isnet"?sess.outputNames[0]:sess.outputNames[sess.outputNames.length-1]];log("infer ms "+Math.round(performance.now()-t0)+" dims "+o.dims);
const w=img.naturalWidth,h=img.naturalHeight,m=document.createElement("canvas");m.width=m.height=S;const mx=m.getContext("2d"),id=mx.createImageData(S,S);
for(let i=0;i<p;i++){const v=KIND==="isnet"?Math.max(0,Math.min(255,Math.round(o.data[i]*255))):Math.max(0,Math.min(255,Math.round(255/(1+Math.exp(-o.data[i])))));id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255}mx.putImageData(id,0,0);
const r=document.createElement("canvas");r.width=w;r.height=h;const rx=r.getContext("2d");rx.drawImage(m,0,0,w,h);
const comp=document.createElement("canvas");comp.width=w*2+10;comp.height=h;const cx=comp.getContext("2d");cx.fillStyle="#666";cx.fillRect(0,0,comp.width,h);cx.drawImage(img,0,0);cx.drawImage(r,w+10,0);
await fetch("/save/"+TRIAL+"/"+KIND+".png",{method:"POST",body:comp.toDataURL("image/png"),headers:{"X-Encoding":"dataurl"}});
log("saved");window.QC_DONE=true;
</script>
